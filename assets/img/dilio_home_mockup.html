<div style="display: flex; justify-content: center; padding: 2rem 0; background: var(--color-background-secondary); border-radius: var(--border-radius-lg);">
  <div style="width: 300px; background: #FAFAFC; border-radius: 32px; padding: 18px 14px; border: 0.5px solid var(--color-border-tertiary);">
    <div style="padding: 12px 6px 22px;">
      <div style="font-size: 24px; font-weight: 500; color: #1A1A22; letter-spacing: -0.5px;">Dilio</div>
      <div style="font-size: 13px; color: #8E8E93; margin-top: 2px;">What's the verdict?</div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div style="background: #7C5CFF; color: white; padding: 16px 14px; border-radius: 18px; height: 108px; display: flex; flex-direction: column; justify-content: space-between;">
        <i class="ti ti-rotate-clockwise" style="font-size: 22px;" aria-hidden="true"></i>
        <div>
          <div style="font-size: 15px; font-weight: 500;">Wheel</div>
          <div style="font-size: 11px; opacity: 0.78;">Spin to decide</div>
        </div>
      </div>
      <div style="background: white; color: #1A1A22; padding: 16px 14px; border-radius: 18px; height: 108px; display: flex; flex-direction: column; justify-content: space-between; border: 0.5px solid #E5E5EA;">
        <i class="ti ti-circle" style="font-size: 22px; color: #FF6B6B;" aria-hidden="true"></i>
        <div>
          <div style="font-size: 15px; font-weight: 500;">Coin flip</div>
          <div style="font-size: 11px; color: #8E8E93;">Heads or tails</div>
        </div>
      </div>
      <div style="background: white; color: #1A1A22; padding: 16px 14px; border-radius: 18px; height: 108px; display: flex; flex-direction: column; justify-content: space-between; border: 0.5px solid #E5E5EA;">
        <i class="ti ti-list" style="font-size: 22px; color: #7C5CFF;" aria-hidden="true"></i>
        <div>
          <div style="font-size: 15px; font-weight: 500;">Pick from list</div>
          <div style="font-size: 11px; color: #8E8E93;">Your options</div>
        </div>
      </div>
      <div style="background: #FF6B6B; color: white; padding: 16px 14px; border-radius: 18px; height: 108px; display: flex; flex-direction: column; justify-content: space-between;">
        <i class="ti ti-help" style="font-size: 22px;" aria-hidden="true"></i>
        <div>
          <div style="font-size: 15px; font-weight: 500;">Yes / No</div>
          <div style="font-size: 11px; opacity: 0.78;">Just ask</div>
        </div>
      </div>
    </div>
    <div style="margin-top: 18px; padding: 14px; background: #1A1A22; color: white; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500;">
      <i class="ti ti-bookmark" style="font-size: 17px;" aria-hidden="true"></i>
      Saved lists
    </div>
  </div>
</div>
