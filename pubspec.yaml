name: diliow
description: "Diliow — Spin a wheel, flip a coin, pick from a list, or ask yes/no."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local persistence
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.0.1
  path_provider: ^2.1.4

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI / UX
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.20.2

  # Sharing
  share_plus: ^10.0.0
  path: ^1.9.0

  # Utility
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_ce_generator: ^1.7.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/img/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/img/icon.png"
  adaptive_icon_background: "#00B8A9"
  adaptive_icon_foreground: "assets/img/icon_foreground.png"

flutter_native_splash:
  color: "#FAFAFC"
  color_dark: "#0F0F14"
  image: "assets/img/logo.png"
  android_12:
    image: "assets/img/logo.png"
    color: "#FAFAFC"
    color_dark: "#0F0F14"
